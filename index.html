<html>
    <head>
        <title>Secret Message</title>
        <script>
            function change(hide,show)
            {

                if(check())
                {
                document.getElementById(hide).style.display='none'; 
                document.getElementById(show).style.display='block';
                }
                else
                {
                    document.getElementById("message").innerHTML=("Wrong Input");
                }
                return false;
            }
            function check()
            {
                let a,b;
                a=document.getElementById("UID").value;
                b=document.getElementById("pass").value;
                if(a=="Neha" && b=="mypassforneha")
                {
                    return true;
                } 
                return false;
            }
        </script>
    </head>
    <body>
        <center>
        <div id = "Page 1">
            <h2>Secret message</h2>
            <p>Enter username</p>
            <input type = "text" id = "UID">
            <p>Enter password</p>
            <input type = "text" id = "pass">
            <br>
            <br>
            <button onclick = "return change('Page 1','Page 2');">Confirm</button>
            <br><br>
            <p id="message" style="color: crimson;"></p>
        </div>
        <div id = "Page 2" style = "display: none">
            <p>Hello, I'm Surabhi</p>
            <button onclick = "return change('Page 2','Page 1');">Back</button>
        </div>
        </center>
    </body>
</html>
